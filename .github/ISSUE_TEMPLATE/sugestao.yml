name: Sugerir uma melhoria
description: Ideia de nova funcionalidade ou melhoria em algo que já existe.
title: "[Sugestão]: "
labels: ["melhoria"]
body:
  - type: markdown
    attributes:
      value: |
        Que bom que você quer contribuir com ideias!
        Quanto mais contexto, mais fácil avaliar a sugestão.

  - type: dropdown
    id: projeto
    attributes:
      label: Projeto
      options:
        - King's Newsletter
        - King's Economy
        - King's Sports
        - Todos / ecossistema
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: Qual problema essa ideia resolve?
      description: Conte a situação que motivou a sugestão.
      placeholder: Sempre que quero rever uma notícia antiga, tenho dificuldade para encontrá-la...
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: Como você imagina a solução?
      placeholder: Uma busca no arquivo com filtro por data e por tema.
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Outras formas de resolver que você pensou.

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Referências, exemplos de outros sites, rascunhos ou imagens.
